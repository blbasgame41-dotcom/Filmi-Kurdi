<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurdish Cinema - وێبسایتی فیلم</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #141414;
            color: #ffffff;
            padding-bottom: 50px;
        }
        header {
            background-color: #000000;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e50914;
        }
        .logo {
            color: #e50914;
            font-size: 24px;
            font-weight: bold;
        }
        .search-box input {
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            outline: none;
            background: #333;
            color: white;
            font-size: 14px;
        }
        .hero {
            background: linear-gradient(to top, #141414, transparent), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1000&q=80') center/cover;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }
        .hero h1 { font-size: 28px; margin-bottom: 10px; }
        .hero p { color: #ccc; font-size: 14px; margin-bottom: 15px; }
        .btn-play {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: fit-content;
        }
        /* بەشی پەخشی ڤیدیۆ کە لە سەرەتادا شاردراوەتەوە */
        .player-container {
            display: none;
            padding: 20px;
            background: #000;
        }
        .player-container video {
            width: 100%;
            border-radius: 8px;
        }
        .section-title {
            padding: 20px 20px 10px 20px;
            font-size: 18px;
            color: #ffffff;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding: 0 20px;
        }
        .movie-card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .movie-info {
            padding: 10px;
        }
        .movie-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-year {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">کورد سینەما</div>
        <div class="search-box">
            <input type="text" placeholder="گەڕان بۆ فیلم...">
        </div>
    </header>

    <!-- شاشەی پەخشی ڤیدیۆ (بۆ ئەوکاتەی دوگمەی سەیرکردن دادەگریت) -->
    <    <!-- شاشەی پەخشی ڤیدیۆ (بۆ ئەوکاتەی دوگمەی سەیرکردن دادەگریت) -->
    <div class="player-container" id="videoPlayerSection">
        <iframe width="100%" height="315" src="https://www.youtube.com/embed/v2H1s9gj5DA" title="Interstellar Docking Scene" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <div class="hero" id="heroSection">
        <h1>فیلمی تایبەت: Interstellar</h1>
        <p>چیرۆکی گەشتێکی زانستی بۆ داهاتووی مرۆڤایەتی...</p>
        <button class="btn-play" onclick="playMovie()">▶ سەیرکردن</button>
    </div>

    <div class="section-title">تازەترین فیلمەکان</div>

    <div class="movies-grid">
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80" alt="Movie">
            <div class="movie-info">
                <div class="movie-title">Batman Beyond</div>
                <div class="movie-year">2024 • ئاکشن</div>
            </div>
        </div>
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=500&q=80" alt="Movie">
            <div class="movie-info">
                <div class="movie-title">Inception</div>
                <div class="movie-year">2010 • خەیاڵی</div>
            </div>
        </div>
        <div class="movie-card">
            <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=500&q=80" alt="Movie">
            <div class="movie-info">
                <div class="movie-title">The Dark Knight</div>
                <div class="movie-year">2008 • تاوان</div>
            </div>
        </div>
    </div>

    <script>
        function playMovie() {
            // نیشاندانی پەخشکەری ڤیدیۆ و شاردنەوەی وێنەی سەرەکی
            document.getElementById('videoPlayerSection').style.display = 'block';
            document.getElementById('videoPlayerSection').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
<div class="movie-card">
        <a href="https://drive.google.com/file/d/1C9F5Wkn-WFIz6gPzFrjrHKT-CV2UY5IH/view?usp=share_link" target="_blank">
                <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401" alt="Movie Cover" style="width: 100%; border-radius: 8px;">
                        <div style="padding: 10px; background: #222; text-align: center; color: #fff; font-weight: bold;">Lord Of The King</div>
                            </a>
                            </div>
                            
</body>
  </html>
